name: iOS
on:
  push:
    paths: ['ios/**', 'scripts/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'scripts/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test
        run: xcodebuild -project ios/ClassicalGuide.xcodeproj -scheme ClassicalGuide -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: build/Tests.xcresult
